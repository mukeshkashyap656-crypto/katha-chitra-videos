name: Katha Chitra daily
# Roz subah 6:30 IST: aane wale dino ke bhaag ka issue khud banata hai aur AI Helper se banwata hai (title mein [AUTOPOST]).
on:
  schedule:
    - cron: '0 1 * * *'
  workflow_dispatch:
    inputs:
      force_bhag:
        description: "Sirf is bhaag ko abhi banao (khaali = tithi ke hisaab se)"
        required: false
permissions:
  contents: write
  issues: write
  actions: write
  models: read
concurrency:
  group: ai-helper-queue
  cancel-in-progress: false
jobs:
  daily:
    runs-on: ubuntu-latest
    timeout-minutes: 170
    steps:
      - uses: actions/checkout@v5
        with:
          ref: auto-video
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install -q --upgrade google-genai requests
      - name: Banao
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          FORCE_BHAG: ${{ inputs.force_bhag }}
        run: |
          git config user.name katha-chitra-bot
          git config user.email bot@users.noreply.github.com
          python -u tools/ramayan_ai.py daily
