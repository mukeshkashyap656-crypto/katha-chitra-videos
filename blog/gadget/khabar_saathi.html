<style>
#khs{box-sizing:border-box;position:relative;display:flex;flex-direction:column;align-items:center;gap:9px;max-width:620px;margin:16px auto 4px;padding:16px 14px 12px;border:1px solid rgba(56,225,255,.6);border-radius:16px;background:radial-gradient(circle at 50% 22%,#06304a 0,#020b14 58%,#000 100%);box-shadow:0 0 22px rgba(56,225,255,.32);text-align:center;color:#dff8ff;font:400 14px/1.6 'Noto Sans Devanagari',sans-serif;text-transform:none;letter-spacing:0;white-space:normal;overflow:hidden}
#khs:before{content:"";position:absolute;top:0;left:0;right:0;bottom:0;pointer-events:none;background:linear-gradient(rgba(56,225,255,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(56,225,255,.07) 1px,transparent 1px);background-size:28px 28px}
#khs *{box-sizing:border-box}
#khs>*{position:relative}
#khs .name{font:600 15px/1.5 monospace;letter-spacing:.45em;padding-left:.45em;color:#7fe9ff;text-shadow:0 0 12px #38e1ff}
#khs .sub{margin-top:-8px;font-size:12px;color:#a5f3fc}
#khs .wave{display:flex;align-items:center;justify-content:center;gap:4px;height:46px;max-width:100%}
#khs .wave i{width:4px;border-radius:3px;background:#38e1ff;box-shadow:0 0 8px #38e1ff;animation:khsw 1.8s ease-in-out infinite alternate}
#khs.talk .wave i{animation-duration:.38s;background:#9af1ff;box-shadow:0 0 14px #9af1ff}
@keyframes khsw{from{transform:scaleY(.35)}to{transform:scaleY(1)}}
#khs button{cursor:pointer;border:1px solid rgba(56,225,255,.7);border-radius:10px;background:rgba(6,48,68,.8);color:#e8fbff;font:600 12px/1.4 'Noto Sans Devanagari',sans-serif;padding:8px 11px;margin:0}
#khs .out{width:100%;max-height:210px;overflow:auto}
#khs .out p{margin:0 0 4px;color:#e6f6ff;font-size:15px;line-height:1.65}
#khs .out p.q{color:#ffe082;font-size:14px}
#khs .out a{display:block;color:#7fe9ff;text-decoration:underline;margin:3px 0}
#khs .chips{display:flex;flex-wrap:wrap;justify-content:center;gap:6px}
#khs form{display:flex;gap:6px;width:100%;margin:0}
#khs input{flex:1;min-width:0;border:1px solid rgba(56,225,255,.55);border-radius:10px;background:rgba(1,10,16,.9);color:#fff;font-size:16px;padding:6px 12px;height:40px}
#khs .note{font-size:11px;color:#8fb4c9}
@media (prefers-reduced-motion:reduce){#khs .wave i{animation:none}}
/* phone par theme ka header 48px khisak kar dibba kaat deta tha */
@media screen and (max-width:600px){.centered-top .blog-name.container{display:block !important;padding-left:0 !important;padding-right:0 !important}.centered-top .header,.centered-top .header-widget{width:100% !important;max-width:100% !important;min-width:0 !important;box-sizing:border-box}}
#khs .views{box-sizing:border-box;width:100%;margin-top:4px;padding:9px 10px;border:1px solid rgba(56,225,255,.6);border-radius:12px;background:#020b14;text-align:center;color:#a9ecfa;font-size:12px;line-height:1.5}
#khs .views b{display:block;color:#5fe6ff;font-size:26px;line-height:1.3}
@media screen and (min-width:1000px){#khs .views{position:absolute;left:calc(100% + 14px);top:0;width:140px;margin:0}}
</style>
<script>
//<![CDATA[
(function(){
if(window.__khs)return;window.__khs=1;
/* asli AI jodna ho to apni Apps Script ka /exec pata yahan likhein (ai_backend.gs dekhein). Khali = sirf blog se jawab. API key yahan KABHI nahi. */
var AI_URL='';
/* greeting ki recording (mic page wali awaaz) */
var CLIPS='https://cdn.jsdelivr.net/gh/mukeshkashyap656-crypto/katha-chitra-videos@5e584b430dbafa2757539b85d27970008eeb0722/blog/gadget/awaaz/';
/* har baat ki recording ki soochi (blog-awaaz branch) */
var LIST='https://raw.githubusercontent.com/mukeshkashyap656-crypto/katha-chitra-videos/blog-awaaz/list.json';
var FILES='https://cdn.jsdelivr.net/gh/mukeshkashyap656-crypto/katha-chitra-videos@';
function start(){
 var head=document.querySelector('.Header .header-widget')||document.querySelector('.Header');
 if(!head)return;
 function el(t,c,x){var e=document.createElement(t);if(c)e.className=c;if(x)e.textContent=x;return e;}
 function btn(x,f){var b=el('button','',x);b.type='button';b.onclick=f;return b;}
 function get(k){try{return localStorage.getItem(k)}catch(e){return null}}
 function set(k,v){try{localStorage.setItem(k,v)}catch(e){}}
 var muted=get('khsMute')==='1',posts=null,player=new Audio(),run=0,rec=null;
 var box=el('div');box.id='khs';
 var wave=el('div','wave');wave.setAttribute('aria-hidden','true');
 [10,18,14,28,22,36,26,42,30,46,30,42,26,36,22,28,14,18,10].forEach(function(h,n){var b=el('i');b.style.height=h+'px';b.style.animationDelay=((n*7)%11)/10+'s';wave.appendChild(b)});
 var soundBtn=btn('',function(){muted=!muted;set('khsMute',muted?'1':'0');label();if(muted){hush()}else{playHello()}});
 function label(){soundBtn.textContent=muted?'🔇 आवाज़ बंद':'🔊 आवाज़ चालू';}
 label();
 var out=el('div','out');out.setAttribute('aria-live','polite');
 var chips=el('div','chips'),form=el('form'),input=el('input');
 input.type='text';input.placeholder='अपना सवाल लिखें…';input.setAttribute('aria-label','सवाल');input.maxLength=150;
 form.appendChild(input);
 var SR=window.SpeechRecognition||window.webkitSpeechRecognition;
 var talk=false,ear=null,quiet=0,micBtn=null;
 if(SR){micBtn=btn('🎤',function(){if(talk){hush();stopTalk()}else{talk=true;quiet=0;mark();hush();micLabel();listen()}});micBtn.setAttribute('aria-label','बात-चीत शुरू या बंद');form.appendChild(micBtn);}
 function micLabel(){if(micBtn){micBtn.textContent=talk?'🔴 सुन रहा':'🎤';micBtn.classList.toggle('on',talk)}}
 function stopTalk(){talk=false;if(ear){var e=ear;ear=null;try{e.abort()}catch(x){}}micLabel()}
 /* ek baar mic dabane ke baad: suno, jawab do, phir suno */
 function listen(){
  if(!talk||ear||document.hidden)return;
  var r=new SR(),heard=false;ear=r;r.lang='hi-IN';
  r.onresult=function(e){heard=true;quiet=0;ask(e.results[0][0].transcript)};
  r.onerror=function(e){if(e.error==='not-allowed'||e.error==='service-not-allowed'||e.error==='audio-capture'||e.error==='network'){stopTalk();reply('माइक से आवाज़ नहीं मिली। आप लिखकर पूछ सकते हैं।')}};
  r.onend=function(){if(ear!==r)return;ear=null;if(heard)return;if(++quiet>=4){stopTalk();return}setTimeout(listen,300)};
  try{r.start()}catch(e){stopTalk()}
 }
 function next(){if(talk)setTimeout(listen,350)}
 document.addEventListener('visibilitychange',function(){if(document.hidden)stopTalk()});
 var go=el('button','','पूछें');go.type='submit';form.appendChild(go);
 form.onsubmit=function(e){e.preventDefault();var q=input.value.trim();if(q){input.value='';ask(q)}};
 box.appendChild(el('div','name','KHABAR SAATHI'));box.appendChild(el('div','sub','khabaradda का सहायक'));box.appendChild(wave);box.appendChild(out);box.appendChild(chips);box.appendChild(form);
 box.appendChild(el('div','note',AI_URL?'मैं AI सहायक हूँ, गलती कर सकता हूँ। आपका सवाल Google की AI सेवा को जाता है, निजी जानकारी न लिखें।':'मैं अपने-आप चलने वाला सहायक हूँ। जवाब इसी ब्लॉग के लेखों से देता हूँ।'));
 box.appendChild(el('div','note','आवाज़: Piper "pratham" (CC BY-NC-SA 4.0)'));
 head.appendChild(box);
 recordings();

 function line(t,c){var p=el('p',c,t);out.appendChild(p);out.scrollTop=out.scrollHeight;return p;}
 function link(p){var a=el('a','','➜ '+p.title);a.href=p.url;out.appendChild(a);}
 /* sirf ek hi awaaz: pehle se bani recording. Phone/browser ki awaaz kahin nahi. */
 function hush(){run++;player.onplaying=player.onended=player.onerror=null;player.pause();box.classList.remove('talk')}
 /* urls ek ke baad ek; sach (true) = pehli baj gayi. 'ruka' = browser ne bina chhue roka */
 function playList(urls,done){
  var me=++run;player.pause();box.classList.remove('talk');
  return new Promise(function(res){
   var n=0;
   function next(){
    if(me!==run)return;
    if(n>=urls.length){box.classList.remove('talk');res(true);if(done)done();return}
    var bad=false;function skip(){if(bad||me!==run)return;bad=true;n++;next()}
    player.onplaying=function(){box.classList.add('talk');res(true)};
    player.onended=function(){n++;next()};player.onerror=skip;
    player.src=urls[n];var p=player.play();
    if(p&&p.catch)p.catch(function(e){if(me!==run)return;if(e&&(e.name==='NotAllowedError'||e.name==='AbortError')){box.classList.remove('talk');res(false)}else skip()});
   }
   next();
  });
 }
 function playHello(){if(muted)return Promise.resolve(false);hush();return playList([CLIPS+'salaam-'+hello.part+'.mp3'])}
 function recordings(){
  if(!rec)rec=fetch(LIST).then(function(r){if(!r.ok)throw 0;return r.json()}).then(function(j){var has={};j.k.forEach(function(h){has[h]=1});return {base:FILES+j.base+'/s/',has:has}}).catch(function(){rec=null;return null});
  return rec;
 }
 /* yeh teen function blog/awaaz_banao.py jaise hi rehne chahiye */
 function norm(t){return t.toLowerCase().replace(/[^\p{L}\p{M}\p{N}]/gu,'')}
 function code(t){var k=norm(t),h=2166136261;for(var i=0;i<k.length;i++){h^=k.charCodeAt(i);h=Math.imul(h,16777619)}return ('0000000'+(h>>>0).toString(16)).slice(-8)}
 function sentences(t){return t.replace(/([\u0964?!]|\.(?=\s+[^\d\s]))\s+/g,'$1\n').split('\n').map(function(x){return x.trim()}).filter(function(x){return norm(x)})}
 function say(parts){
  hush();if(ear){var e=ear;ear=null;try{e.abort()}catch(x){}}if(muted){next();return}var me=run;
  var all=[];[].concat(parts).forEach(function(t){all=all.concat(sentences(String(t)))});
  recordings().then(function(r){
   if(me!==run)return;
   var found=r?all.filter(function(t){return r.has[code(t)]}):[];
   if(found.length<all.length)line('(इस जवाब के कुछ हिस्से की आवाज़ अभी तैयार नहीं है, ऊपर लिखा हुआ पढ़ लीजिए।)','miss');
   if(found.length)playList(found.map(function(t){return r.base+code(t)+'.mp3'}),next);else next();
  });
 }
 /* parts: ek line ya kai tukde; likha saath, awaaz tukde-tukde */
 function reply(parts){parts=[].concat(parts);line(parts.join(' '));say(parts)}
 function article(){
  if(!/\/\d{4}\/\d{2}\/.+\.html$/.test(location.pathname))return null;
  var b=document.querySelector('.post-body'),h=document.querySelector('.post-title');if(!b||!h)return null;
  var c=b.cloneNode(true);[].forEach.call(c.querySelectorAll('script,style,figure,table.tr-caption-container,small'),function(x){x.remove()});
  [].forEach.call(c.querySelectorAll('td,th'),function(x){x.appendChild(document.createTextNode(' '))});
  [].forEach.call(c.querySelectorAll('p,h2,h3,li,div,br,tr'),function(x){x.appendChild(document.createTextNode('\n'))});
  var rows=c.textContent.split('\n').map(function(s){return s.trim()}).filter(function(s){return s.length>30&&!/^(फ़ोटो|फोटो|Photo|स्रोत)/i.test(s)});
  return {title:h.textContent.trim(),rows:rows};
 }
 function greeting(){
  var h=new Date().getHours();
  var part=h>=5&&h<12?'subah':h>=12&&h<17?'dopahar':h>=17&&h<21?'shaam':'raat';
  var first={subah:'गुड मॉर्निंग सर!',dopahar:'गुड आफ़्टरनून सर!',shaam:'गुड ईवनिंग सर!',raat:'नमस्ते सर! रात के इस समय भी'}[part];
  var text=first+' khabaradda पर आपका स्वागत है। मैं खबर साथी हूँ। बताइए, '+(part==='subah'?'आज ':'')+'क्या पढ़ना है?';
  var a=article();
  return {part:part,text:text,show:text+(a?' आप यह लेख पढ़ रहे हैं: '+a.title+'।':'')};
 }
 function strip(h){var d=new DOMParser().parseFromString(h.replace(/<\/(td|th)>/gi,'$& ').replace(/<\/(p|h\d|li|div|tr)>|<br\s*\/?>/gi,'$&\n'),'text/html');[].forEach.call(d.querySelectorAll('script,style,figure,table.tr-caption-container,small'),function(x){x.remove()});return d.body.textContent.replace(/\u00a0/g,' ');}
 function load(){
  if(posts)return Promise.resolve(posts);
  return fetch('/feeds/posts/default?alt=json&max-results=150').then(function(r){if(!r.ok)throw 0;return r.json()}).then(function(j){
   posts=(j.feed.entry||[]).map(function(e){var l=(e.link||[]).filter(function(l){return l.rel==='alternate'})[0];
    return {title:e.title.$t,url:l?l.href:'/',text:strip((e.content||e.summary||{$t:''}).$t),labels:(e.category||[]).map(function(c){return c.term.toLowerCase()})}});
   return posts;});
 }
 var MAP={mobile:['मोबाइल','फोन','फ़ोन'],phone:['मोबाइल','फोन','फ़ोन'],naukri:['नौकरी','भर्ती'],job:['नौकरी','भर्ती'],yojana:['योजना'],game:['गेम','gaming'],gaming:['गेम'],message:['मैसेज'],whatsapp:['व्हाट्सऐप'],budget:['बजट'],price:['दाम','कीमत'],daam:['दाम','कीमत'],schedule:['शेड्यूल'],camera:['कैमरा'],battery:['बैटरी']};
 var STOP=' kare karen karein kaisa करें करे कैसे kya hai hain ka ki ke ko me mein par aur batao bataye bataiye mujhe koi kaise kab the is wala wali news khabar the what how about tell show क्या है हैं का की के को में पर और बताओ बताइए मुझे कोई कैसे कब इस वाला वाली खबर ख़बर बारे लेख पोस्ट ';
 function words(q){var w=q.toLowerCase().split(/[\s,.?!।:'"()]+/).filter(function(s){return s.length>1&&STOP.indexOf(' '+s+' ')<0});return w.map(function(s){return [s].concat(MAP[s]||[])});}
 function search(q){
  var w=words(q);
  load().then(function(list){
   var hits=list.map(function(p){var t=p.title.toLowerCase(),b=p.text.toLowerCase(),sc=0,n=0;
    w.forEach(function(alt){var s=0;alt.forEach(function(a){if(t.indexOf(a)>=0)s=Math.max(s,3);else if(p.labels.indexOf(a)>=0)s=Math.max(s,2);else if(b.indexOf(a)>=0)s=Math.max(s,1)});if(s){sc+=s;n++}});
    return {p:p,sc:sc,n:n}}).filter(function(x){return x.n&&x.n*2>=w.length}).sort(function(a,b){return b.sc-a.sc});
   hits=hits.filter(function(x){return x.sc*2>=hits[0].sc}).slice(0,3);
   if(!hits.length){reply('इस बारे में हमारे ब्लॉग पर अभी मुझे कुछ नहीं मिला। मैं सिर्फ़ इसी ब्लॉग के लेखों से जवाब देता हूँ।');return;}
   var best=hits[0].p,most=0,pick='';
   sentences(best.text).forEach(function(t){var l=t.toLowerCase();if(t.length<=25||t.length>=300||/सांकेतिक|फ़ोटो:|फोटो:|photo:/i.test(t))return;
    var n=w.filter(function(alt){return alt.some(function(a){return l.indexOf(a)>=0})}).length;if(n>most){most=n;pick=t.trim()}});
   reply(pick?['हमारे लेख में लिखा है:',pick]:'इससे जुड़े लेख नीचे हैं।');hits.forEach(function(x){link(x.p)});out.scrollTop=out.scrollHeight;
  }).catch(function(){reply('अभी लेख खोल नहीं पाया। थोड़ी देर बाद फिर पूछिए।')});
 }
 function latest(label){
  load().then(function(list){var l=list.filter(function(p){return !label||p.labels.indexOf(label)>=0}).slice(0,3);
   if(!l.length){reply('इस हिस्से में अभी कोई लेख नहीं है।');return;}
   reply(['सबसे नया लेख है:',l[0].title]);l.forEach(link);out.scrollTop=out.scrollHeight;}).catch(function(){reply('अभी लेख खोल नहीं पाया। थोड़ी देर बाद फिर पूछिए।')});
 }
 function summary(full){
  var a=article();if(!a){reply('कोई लेख खोलिए, फिर मैं उसके बारे में बता दूँगा।');return;}
  reply(full?[a.title].concat(a.rows):['इस लेख की शुरुआत:'].concat(a.rows.slice(0,2)));
 }
 function smart(q){
  var wait=line('सोच रहा हूँ…');
  var stop=new Promise(function(_,no){setTimeout(no,20000)});
  Promise.race([fetch(AI_URL+'?q='+encodeURIComponent(q.slice(0,200))+'&p='+encodeURIComponent(location.pathname)).then(function(r){return r.json()}),stop])
  .then(function(j){if(!j||!j.answer)throw 0;wait.remove();reply(j.answer)}).catch(function(){wait.remove();search(q.toLowerCase())});
 }
 function ask(q){
  line(q,'q');var s=q.toLowerCase().trim();
  if(/^(hi|hello|hey|namaste|namaskar|नमस्ते|नमस्कार|हेलो|हैलो)[\s!.]*$/.test(s)){hello=greeting();line(hello.show);playHello();return}
  if(/(kaise ho|kaisa hai|how are you|कैसे हो|कैसे हैं आप|क्या हाल)/.test(s))return reply('मैं ठीक हूँ सर, धन्यवाद। बताइए, क्या पढ़ना है?');
  if(/(thank|dhanyavad|dhanyawad|shukriya|धन्यवाद|शुक्रिया|थैंक)/.test(s))return reply('आपका स्वागत है सर। और कुछ पूछना हो तो बताइए।');
  if(/^(bye|alvida|band karo|chup|stop|बाय|अलविदा|बंद करो|चुप|रुको|बस)[\s!.।]*(करो|हो जाओ)?[\s!.।]*$/.test(s)){stopTalk();return reply('ठीक है सर, फिर मिलते हैं।')}
  if(/(kya kar sakte|what can you|madad|help|क्या कर सकते|मदद)/.test(s))return reply('मैं ताज़ा खबर बता सकता हूँ, खुला लेख सुना सकता हूँ, और इस ब्लॉग के लेखों से सवाल का जवाब दे सकता हूँ।');
  if(/(tum kaun|who are you|tumhara naam|aap kaun|तुम कौन|आप कौन|तुम्हारा नाम|आपका नाम)/.test(s))return reply('मैं खबर साथी हूँ, khabaradda का अपने-आप चलने वाला सहायक।');
  if(/(blog kis|kiska blog|owner|kisne (banaya|likha)|किसका ब्लॉग|ब्लॉग किस|किसने (बनाया|लिखा))/.test(s))return reply('यह khabaradda ब्लॉग है। यहाँ लेख MUKESH News के नाम से छपते हैं।');
  if(/(contact|sampark|संपर्क)/.test(s)){reply('संपर्क का पन्ना नीचे है।');link({title:'Contact',url:'/p/contact.html'});return;}
  if(/(ye lekh|yeh lekh|ye article|summary|saransh|यह लेख|ये लेख|सारांश|किस बारे में)/.test(s))return summary(false);
  if(/(lekh sunao|padh ?kar sunao|read (it|aloud)|लेख सुनाओ|पढ़कर सुनाओ)/.test(s))return summary(true);
  if(/(latest|taaza|taza|nayi khabar|aaj ki khabar|ताज़ा|ताजा|नई खबर|आज की खबर)/.test(s)){
   var cat=[[/mobile|मोबाइल/,'mobile'],[/naukri|नौकरी/,'sarkari naukri'],[/yojana|योजना/,'yojana'],[/gam(e|ing)|गेम/,'gaming'],[/\btech\b|टेक/,'tech']].filter(function(c){return c[0].test(s)})[0];
   return latest(cat&&cat[1]);}
  if(AI_URL)return smart(q);
  if(!words(s).length)return reply('थोड़ा और साफ़ पूछिए, जैसे: मोबाइल की नई खबर।');
  search(s);
