name: Free raaste ki jaanch
# Sirf jaanch: har free AI ko ek chhota sawaal. Kuch likhta/post nahi karta. Haath se chalao (Run workflow).
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: auto-video
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -q google-genai requests pillow
      - name: Har raasta chala kar dekho
        env:
          NO_LOCAL: '1'
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY_KATHA || secrets.GEMINI_API_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          SAMBANOVA_API_KEY: ${{ secrets.SAMBANOVA_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          COHERE_API_KEY: ${{ secrets.COHERE_API_KEY }}
          ZAI_API_KEY: ${{ secrets.ZAI_API_KEY }}
        run: python tools/free_routes_test.py
