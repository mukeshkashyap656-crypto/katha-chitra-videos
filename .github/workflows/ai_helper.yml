name: Katha Chitra AI Helper

# Free AI helper (Gemini key se), sirf Katha Chitra (Ramayan) ke liye.
# Issue ya comment mein "@ai <kaam>" likho: plan banana, episode banana, sudhaar karna, sawaal poochhna.
# Har issue ki apni branch: ai/issue-<number>. Video banne tak ruk kar link + director check deta hai.
# Ye file "main" branch par bhi honi chahiye (GitHub issue wale kaam wahi se chalata hai).
on:
  issues:
    types: [opened]
  issue_comment:
    types: [created]
  schedule:
    - cron: '7 0 * * *'    # subah 5:37 IST: free AI khaali, 'baad-mein' wale kaam
    - cron: '37 9 * * *'   # dopahar 3:07 IST: doosri koshish
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  actions: write
  models: read

concurrency:
  group: ai-helper-${{ github.event.issue.number || 'queue' }}
  cancel-in-progress: false

jobs:
  do-task:
    # Sirf repo ka maalik (aap) "@ai" se kaam de sakta hai.
    if: >-
      (github.event_name == 'issues' &&
       contains(github.event.issue.body, '@ai') &&
       github.event.issue.user.login == github.repository_owner) ||
      (github.event_name == 'issue_comment' &&
       !github.event.issue.pull_request &&
       contains(github.event.comment.body, '@ai') &&
       github.event.comment.user.login == github.repository_owner)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
        with:
          ref: auto-video
          fetch-depth: 1
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install -q --upgrade google-genai requests
      - name: Do the task
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          REQUEST: ${{ github.event.comment.body || github.event.issue.body }}
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then
            gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body "⚠️ Is repo mein GEMINI_API_KEY nahi hai. Settings → Secrets and variables → Actions → New repository secret → naam GEMINI_API_KEY, value apni Gemini key."
            exit 1
          fi
          python -u tools/ramayan_ai.py task

  queued:
    # 'baad-mein' label wale issues (jab free AI busy tha) shant samay par khud dobara
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v5
        with:
          ref: auto-video
          fetch-depth: 1
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install -q --upgrade google-genai requests
      - name: Do queued tasks
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: python -u tools/ramayan_ai.py queue
