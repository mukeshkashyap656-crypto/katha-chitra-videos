name: collect-stats
# Roz subah 8:30 IST: YouTube ke asli views stats/STATS.md mein likhta hai (viral radar isi se seekhta hai).
on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  stats:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Stats lao
        working-directory: scripts
        env:
          COMPOSIO_CONSUMER_KEY: ${{ secrets.COMPOSIO_CONSUMER_KEY }}
        run: |
          pip install -q requests
          python collect_stats.py
      - name: Save
        run: |
          git config user.name katha-chitra-bot
          git config user.email bot@users.noreply.github.com
          git add stats
          if git diff --cached --quiet; then echo "kuch badla nahi"; else
            git commit -m "Roz ke asli views (stats)"
            for i in 1 2 3; do git push && break; git pull --rebase; done
          fi

  report:
    needs: stats
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      issues: write
      actions: read
      models: read
    steps:
      - uses: actions/checkout@v5
        with:
          ref: auto-video
          fetch-depth: 1
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install -q --upgrade google-genai requests
      - name: Roz ka report
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          SAMBANOVA_API_KEY: ${{ secrets.SAMBANOVA_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
        run: python -u tools/ramayan_ai.py report
