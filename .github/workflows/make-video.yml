name: Make Ramayan video
# Runs on GitHub's free computer: voice (Madhur) -> drawings -> HyperFrames render -> MP4 + cover.
# Starts by itself when an episode folder under episodes/ changes, or by hand from the Actions tab.
on:
  push:
    paths: ["episodes/**"]
  workflow_dispatch:
    inputs:
      episode:
        description: "Episode folder, e.g. episodes/bhag5"
        required: true
      voice:
        description: "madhur (default) ya piper (sahara wali awaaz test karne ke liye)"
        required: false
        default: "madhur"

permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 2 }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Cache npm + pip (agle video mein download nahi, tez)
        uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            ~/.cache/pip
            ~/.cache/hyperframes
            ~/.cache/kc_voice
          key: render-tools-v2-${{ github.run_id }}
          restore-keys: |
            render-tools-v2-
            render-tools-v1
      - name: Tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg libcairo2-dev pkg-config fonts-noto-core >/dev/null
          pip install -q pycairo numpy pillow edge-tts
      - name: Which episode
        id: ep
        run: |
          if [ -n "${{ github.event.inputs.episode }}" ]; then E="${{ github.event.inputs.episode }}"
          else E=$(git diff --name-only HEAD~1 HEAD -- episodes | cut -d/ -f1-2 | sort -u | head -1); fi
          echo "episode=$E" >> $GITHUB_OUTPUT; echo "Episode: $E"
      - name: Make the episode
        if: steps.ep.outputs.episode != ''
        # Backup 1: kuch bhi atke toh poora episode 3 baar tak dobara banta hai (beech mein ruk ke).
        # Pehli 2 koshish sirf Madhur awaaz; teesri mein hi Piper sahara chal sakta hai.
        run: |
          for TRY in 1 2 3; do
            echo "=== Koshish $TRY ==="
            rm -rf out /tmp/ep
            if [ $TRY -lt 3 ]; then export MADHUR_ONLY=1; else export MADHUR_ONLY=0; fi
            if bash tools/make_episode.sh "${{ steps.ep.outputs.episode }}"; then exit 0; fi
            echo "Koshish $TRY fail hui"; [ $TRY -lt 3 ] && sleep $((90 * TRY))
          done
          exit 1
        env:
          VOICE_ENGINE: ${{ github.event.inputs.voice || 'madhur' }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
      - name: Save the video
        if: always() && steps.ep.outputs.episode != ''
        uses: actions/upload-artifact@v4
        with:
          name: video
          path: out/
          retention-days: 14
      - name: Put the video on its own branch (render-<episode>), only the latest version is kept
        if: always() && steps.ep.outputs.episode != ''
        run: |
          B=render-$(basename "${{ steps.ep.outputs.episode }}")$([ "${{ github.event.inputs.voice }}" = "piper" ] && echo -piper-test || true)
          cd out && git init -q && git checkout -q -b "$B"
          git config user.name "katha-chitra-bot"; git config user.email "bot@users.noreply.github.com"
          git add -A && git commit -q -m "Render of ${{ steps.ep.outputs.episode }} from ${GITHUB_SHA::7}"
          # Backup 2: video branch pe daalna atke toh 4 baar tak dobara
          for TRY in 1 2 3 4; do
            git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" "$B" && exit 0
            echo "push koshish $TRY fail"; sleep $((15 * TRY))
          done
          exit 1
