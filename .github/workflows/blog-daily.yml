name: Blog daily (mobile gaming news, Hindi)
# Mukhya raasta: roz 1 post, din mein 4 koshish: aaj ki mobile gaming khabar -> verify -> apne shabdon mein post -> Blogger.
# Pehle DRAFT mode (MODE=draft). Aap dekhkar manual run mein mode=live karo ya repo variable BLOG_MODE=live set karo.
on:
  schedule:
    # GitHub hi mukhya raasta hai. Din mein ek hi post: aaj ki post ho chuki ho to baaki koshishein turant ruk jaati hain.
    - cron: '7 2 * * *'    # subah 7:37 IST: pehli koshish
    - cron: '17 5 * * *'   # subah 10:47 IST: dobara
    - cron: '37 8 * * *'   # dopahar 2:07 IST: dobara
    - cron: '0 13 * * *'   # shaam 6:30 IST: aakhri koshish
  workflow_dispatch:
    inputs:
      mode:
        description: "draft (Blogger mein draft) ya live (seedha publish)"
        default: "draft"
      dry_run:
        description: "1 = Blogger ko kuch mat bhejo, sirf blog/out mein rakho"
        default: "0"
permissions:
  contents: write
  models: read
concurrency: blog-daily
jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: '3.12' }
      - run: pip install -q --upgrade google-genai requests pillow
      - name: Hindi font (apne cover ke liye)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq fonts-noto-core libfribidi0 || echo "font nahi laga: cover par English shirshak aayega"
      - name: Make today's posts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY_BLOG || secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY_BLOG || secrets.OPENROUTER_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY_BLOG || secrets.GROQ_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY_BLOG || secrets.CEREBRAS_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY_BLOG || secrets.MISTRAL_API_KEY }}
          SAMBANOVA_API_KEY: ${{ secrets.SAMBANOVA_API_KEY_BLOG || secrets.SAMBANOVA_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY_BLOG || secrets.NVIDIA_API_KEY }}
          COHERE_API_KEY: ${{ secrets.COHERE_API_KEY_BLOG || secrets.COHERE_API_KEY }}
          ZAI_API_KEY: ${{ secrets.ZAI_API_KEY_BLOG || secrets.ZAI_API_KEY }}
          BLOG_ID: ${{ secrets.BLOG_ID }}
          BLOGGER_CLIENT_ID: ${{ secrets.BLOGGER_CLIENT_ID }}
          BLOGGER_CLIENT_SECRET: ${{ secrets.BLOGGER_CLIENT_SECRET }}
          BLOGGER_REFRESH_TOKEN: ${{ secrets.BLOGGER_REFRESH_TOKEN }}
          MODE: ${{ github.event.inputs.mode || vars.BLOG_MODE || 'draft' }}
          DRY_RUN: ${{ github.event.inputs.dry_run || '0' }}
          N_POSTS: '1'
          BLOGGER_MAIL_TO: ${{ secrets.BLOGGER_MAIL_TO }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_APP_PASSWORD: ${{ secrets.SMTP_APP_PASSWORD }}
          BLOG_IMG_TOKEN: ${{ secrets.BLOG_IMG_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          BLOG_POST_URL: ${{ secrets.BLOG_POST_URL }}
          BLOG_POST_TOKEN: ${{ secrets.BLOG_POST_TOKEN }}
        run: |
          # Backup: poora kaam 3 baar tak dobara (beech mein ruk ke)
          # exit 2 = post bani par blog tak nahi gayi (setting galat): dobara banane ka fayda nahi, run laal dikhe
          for TRY in 1 2 3; do
            RC=0; python3 blog/blog_bot.py || RC=$?
            [ $RC -eq 0 ] && exit 0
            [ $RC -eq 2 ] && exit 1
            echo "koshish $TRY fail"; [ $TRY -lt 3 ] && sleep $((30 * TRY))
          done
          exit 1
      - name: Save posted list + copies
        if: always()
        run: |
          git config user.name "katha-chitra-bot"; git config user.email "bot@users.noreply.github.com"
          git add blog/posted.json blog/out 2>/dev/null || true
          git diff --cached --quiet || { git commit -q -m "blog: aaj ki posts"; git pull -q --rebase || true; git push -q || true; }
