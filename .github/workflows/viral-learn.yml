name: Viral seekh (roz)
# Roz ek baar (subah ~4:10 baje IST): Ramayan topic ke chhote-channel wale sabse chale Shorts dekh kar
# hook ka dhang VIRAL_LEARN.md mein likhta hai (auto-video branch par). Helper isi se seekhta hai. Kahani nahi badalti.
on:
  schedule:
    - cron: '40 22 * * *'
  workflow_dispatch:
permissions:
  contents: write
  models: read
concurrency: viral-learn
jobs:
  learn:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with:
          ref: auto-video
          fetch-depth: 1
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install -q --upgrade google-genai requests youtube-transcript-api
      - name: Seekho
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY_KATHA || secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python -u tools/viral_learn.py
      - name: MK Gaming ki seekh (alag file)
        if: always()
        continue-on-error: true
        env:
          VIRAL_PROFILE: gaming
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY_GAMING || secrets.YOUTUBE_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY_GAMING }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY_GAMING || secrets.OPENROUTER_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: python -u tools/viral_learn.py
      - name: MK Car ki seekh (alag file)
        if: always()
        continue-on-error: true
        env:
          VIRAL_PROFILE: car
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY_GAMING || secrets.YOUTUBE_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY_GAMING }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY_GAMING || secrets.OPENROUTER_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: python -u tools/viral_learn.py
      - name: Save
        run: |
          git config user.name katha-chitra-bot
          git config user.email bot@users.noreply.github.com
          git add VIRAL_LEARN.md SEEKH_ROZ.md
          for f in GAMING_VIRAL.md CAR_VIRAL.md; do if [ -f $f ]; then git add $f; fi; done
          if git diff --cached --quiet; then echo "kuch badla nahi"; else
            git commit -m "Roz ki viral seekh"
            for i in 1 2 3; do git push origin HEAD:auto-video && break; git pull --rebase origin auto-video; done
          fi
