name: Video Watchdog
# Nigraani wala helper: "Make Ramayan video" fail ho toh use apne aap dobara chalata hai (2 baar tak).
on:
  workflow_run:
    workflows: ["Make Ramayan video"]
    types: [completed]
permissions:
  actions: write
  issues: write
jobs:
  retry:
    if: github.event.workflow_run.conclusion == 'failure' || github.event.workflow_run.conclusion == 'timed_out'
    runs-on: ubuntu-latest
    steps:
      - name: Dobara chalao ya batao
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          BRANCH: ${{ github.event.workflow_run.head_branch }}
          URL: ${{ github.event.workflow_run.html_url }}
        run: |
          echo "Run $RUN_ID (branch $BRANCH) fail hua, koshish $ATTEMPT"
          if [ "$ATTEMPT" -lt 3 ]; then
            sleep 60
            gh api -X POST repos/${{ github.repository }}/actions/runs/$RUN_ID/rerun-failed-jobs
            echo "Dobara chalu kar diya"
          else
            echo "3 baar fail ho chuka, ab insaan ko dekhna hoga"
            N=$(echo "$BRANCH" | grep -oE 'ai/issue-[0-9]+' | grep -oE '[0-9]+' || true)
            if [ -n "$N" ]; then
              gh api repos/${{ github.repository }}/issues/$N/comments -f body="⚠️ Video 3 baar koshish ke baad bhi nahi bana. Log: $URL" >/dev/null
            fi
          fi
