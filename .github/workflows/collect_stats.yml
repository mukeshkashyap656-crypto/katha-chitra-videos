name: collect-stats
# Roz subah 8:30 IST: YouTube ke asli views stats/STATS.md mein likhta hai (viral radar isi se seekhta hai).
on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  stats:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Stats lao
        working-directory: scripts
        env:
          COMPOSIO_CONSUMER_KEY: ${{ secrets.COMPOSIO_CONSUMER_KEY }}
        run: |
          pip install -q requests
          python collect_stats.py
      - name: Save
        run: |
          git config user.name katha-chitra-bot
          git config user.email bot@users.noreply.github.com
          git add stats
          if git diff --cached --quiet; then echo "kuch badla nahi"; else
            git commit -m "Roz ke asli views (stats)"
            for i in 1 2 3; do git push && break; git pull --rebase; done
          fi
